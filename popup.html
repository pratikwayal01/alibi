<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alibi</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="popup">
  <div class="head">
    <img class="logo" src="icons/logo.svg" alt="Alibi logo" width="34" height="34">
    <h1>Alibi</h1>
    <button class="stamp" id="switch" role="switch" aria-checked="true">On duty</button>
  </div>

  <section aria-label="Current aliases">
    <div class="card">
      <img src="icons/mugshot.svg" alt="" width="32" height="32" aria-hidden="true">
      <div class="who">
        <span class="old">Alice</span>
        <span class="alias" id="aliasAlice">…</span>
      </div>
      <button class="dice" id="diceAlice" aria-label="Give them a new alias" title="Give them a new alias">
        <img src="icons/dice.svg" alt="" width="24" height="24" aria-hidden="true">
      </button>
    </div>
    <div class="card">
      <img src="icons/mugshot.svg" alt="" width="32" height="32" aria-hidden="true">
      <div class="who">
        <span class="old">Bob</span>
        <span class="alias" id="aliasBob">…</span>
      </div>
      <button class="dice" id="diceBob" aria-label="Give them a new alias" title="Give them a new alias">
        <img src="icons/dice.svg" alt="" width="24" height="24" aria-hidden="true">
      </button>
    </div>
  </section>

  <h2 id="packLabel">Pick a pack</h2>
  <div class="chips" role="group" aria-labelledby="packLabel" id="chips">
    <button class="chip" data-pack="desi">Desi</button>
    <button class="chip" data-pack="corporate">Corporate</button>
    <button class="chip" data-pack="anime">Anime</button>
    <button class="chip" data-pack="mythic">Mythic</button>
    <button class="chip" data-pack="debug">Debug</button>
    <button class="chip" data-pack="gigachad">Gigachad</button>
  </div>

  <button class="add" id="customToggle" aria-expanded="false" aria-controls="customFields">
    <img src="icons/plus.svg" alt="" width="18" height="18" aria-hidden="true">
    <span>Use my own names</span>
  </button>
  <div class="custom" id="customFields" hidden>
    <label class="visually-hidden" for="customAlice">Name for Alice</label>
    <input type="text" id="customAlice" placeholder="Name for Alice" autocomplete="off" maxlength="40">
    <label class="visually-hidden" for="customBob">Name for Bob</label>
    <input type="text" id="customBob" placeholder="Name for Bob" autocomplete="off" maxlength="40">
  </div>

  <h2 id="swapLabel">Custom swaps</h2>
  <div class="rules" id="ruleList" role="list" aria-labelledby="swapLabel"></div>
  <div class="ruleadd">
    <label class="visually-hidden" for="ruleFrom">Original name</label>
    <input type="text" id="ruleFrom" placeholder="Original" autocomplete="off" maxlength="40">
    <label class="visually-hidden" for="ruleTo">Becomes</label>
    <input type="text" id="ruleTo" placeholder="Becomes" autocomplete="off" maxlength="40">
    <button class="dice dice-sm" id="ruleAdd" aria-label="Add custom swap" title="Add custom swap">
      <img src="icons/plus.svg" alt="" width="24" height="24" aria-hidden="true">
    </button>
  </div>
  <p class="hint" id="ruleHint" hidden>10 swaps max — delete one to add another</p>

  <h2 id="aliasLabel">Aliases</h2>
  <div class="seg" role="group" aria-labelledby="aliasLabel" id="seg">
    <button data-mode="single">One per page</button>
    <button data-mode="chaos">Chaos</button>
  </div>
  <label class="chk">
    <input type="checkbox" id="protectSamples" checked>
    Leave samples and code alone
  </label>

  <p class="saved" id="saved" role="status" aria-live="polite" hidden>Saved</p>

  <footer class="foot">
    <div>
      <img src="icons/magnifier.svg" alt="" width="18" height="18" aria-hidden="true">
      <span id="count">Nothing to rename on this page</span>
    </div>
    <div>
      <img src="icons/shield.svg" alt="" width="18" height="18" aria-hidden="true">
      <span>Nothing leaves your browser</span>
    </div>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
